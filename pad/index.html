<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#3d9de0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Yui Pad" />
    <!-- Installed on iOS: draw under the status bar (the pad pads itself with safe-area insets). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/pad/manifest.webmanifest" />
    <link rel="icon" href="/pad/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/pad/icon-192.png" type="image/png" sizes="192x192" />
    <!-- iOS ignores SVG here: it needs an opaque PNG. -->
    <link rel="apple-touch-icon" href="/pad/apple-touch-icon.png" sizes="180x180" />
    <title>Yui Pad</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
