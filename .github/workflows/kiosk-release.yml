name: Kiosk release

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build installable kiosk release
    runs-on: ubuntu-latest
    env:
      YUI_COMMIT: ${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: controller/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install dependencies
        run: just deps

      - name: Package kiosk installer
        run: just package

      - name: Upload kiosk installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: yui-kiosk-installer-${{ github.sha }}
          path: dist/yui-kiosk-installer.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: kiosk-${{ github.sha }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release delete "$TAG_NAME" --cleanup-tag --yes
          fi

          gh release create "$TAG_NAME" \
            dist/yui-kiosk-installer.zip \
            --target "$GITHUB_SHA" \
            --title "Kiosk build ${GITHUB_SHA::7}" \
            --notes "Install-ready Yui kiosk build for commit $GITHUB_SHA." \
            --prerelease
