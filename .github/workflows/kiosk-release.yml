name: Kiosk release

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build installable kiosk release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: controller/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install platform dependencies
        working-directory: platform
        run: bun install --frozen-lockfile

      - name: Build platform overlay
        working-directory: platform
        run: bun run build

      - name: Build Windows controller
        working-directory: controller
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p ../installer/assets ../dist
          go build -o ../installer/assets/controller.exe .

      - name: Build Windows installer
        working-directory: installer
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p ../dist
          go build -o ../dist/installer.exe .

      - name: Package kiosk installer
        run: |
          rm -rf dist/release
          mkdir -p dist/release
          cp dist/installer.exe dist/release/yui-kiosk-installer.exe
          cd dist/release
          sha256sum yui-kiosk-installer.exe > SHA256SUMS.txt
          cd ..
          zip -qr yui-kiosk-installer.zip release

      - name: Upload kiosk installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: yui-kiosk-installer-${{ github.sha }}
          path: dist/yui-kiosk-installer.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: kiosk-${{ github.sha }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release delete "$TAG_NAME" --cleanup-tag --yes
          fi

          gh release create "$TAG_NAME" \
            dist/yui-kiosk-installer.zip \
            --target "$GITHUB_SHA" \
            --title "Kiosk build ${GITHUB_SHA::7}" \
            --notes "Install-ready Yui kiosk build for commit $GITHUB_SHA." \
            --prerelease
