# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  # Puma request threads hold a connection until a streamed body closes
  # (multi-GB FileRangeBody downloads). Action Cable channel callbacks run
  # on their own worker pool in the same process (default 4; see
  # config/initializers/action_cable.rb). Those threads check out their own
  # connections, so the pool is RAILS_MAX_THREADS + that worker pool.
  #
  # Solid Queue's Puma plugin forks a supervisor unless solid_queue_mode is
  # :async (this app does not set that). Job threads do not share the web
  # process pool; the child gets its own pools of this same size. Solid Queue
  # checks the queue database against worker threads + 2 (queue.yml uses 3,
  # so 5). This size still satisfies that check.
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 }.to_i + ENV.fetch("ACTION_CABLE_WORKER_POOL_SIZE") { 4 }.to_i %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  primary:
    <<: *default
    database: storage/production.sqlite3
  cache:
    <<: *default
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
