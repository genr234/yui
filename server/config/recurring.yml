production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  cleanup_stale_asset_uploads:
    class: CleanupStaleUploadsJob
    schedule: every day at 4am
  sync_linked_accounts:
    class: LinkedAccountsSyncJob
    schedule: every 6 hours
  end_abandoned_play_sessions:
    class: EndAbandonedPlaySessionsJob
    schedule: every minute
  release_stale_players:
    class: ReleaseStalePlayersJob
    schedule: every minute
