# Name of your application. Used to uniquely configure containers.
service: server

# Name of the container image (use your-user/app-name on external registries).
image: server

# Deploy to these servers.
servers:
  web:
    - 192.168.0.1
  # job:
  #   hosts:
  #     - 192.168.0.1
  #   cmd: bin/jobs

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# If used with Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
#
# Using an SSL proxy like this requires turning on config.assume_ssl and config.force_ssl in production.rb!
#
# Don't use this when deploying to multiple web servers (then you have to terminate SSL at your load balancer).
#
# proxy:
#   ssl: true
#   host: app.example.com
#   # Asset library: tus PATCHes are up to 50 MB and kiosk downloads are multi-GB
#   # streams. Don't buffer responses (kiosks resume with Range), allow 64 MB request
#   # bodies, and give slow links time.
#   response_timeout: 600
#   buffering:
#     requests: true
#     responses: false
#     max_request_body: 67_108_864

# Where you keep your container images.
registry:
  # Alternatives: hub.docker.com / registry.digitalocean.com / ghcr.io / ...
  server: localhost:5555

  # Needed for authenticated registries.
  # username: your-user

  # Always use an access token rather than real password when possible.
  # password:
  #   - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    # Fork the Solid Queue supervisor from Puma (plugin default is :fork, not
    # in-process :async) so this container runs jobs without adding those
    # threads to the web connection pool. Split jobs onto their own host once
    # there are multiple servers.
    SOLID_QUEUE_IN_PUMA: true

    # One multi-GB range download holds a Puma thread, and that thread keeps
    # its SQLite connection until the body finishes. Action Cable's worker
    # pool (default 4) also checks out connections in this process.
    # database.yml sizes every pool to RAILS_MAX_THREADS + that worker pool,
    # so eight downloads cannot starve signaling. The forked job process has
    # its own pools; queue.yml's 3 worker threads need only threads + 2 on
    # the queue database, which this still covers.
    RAILS_MAX_THREADS: 8

    # Thruster's 30 s defaults cut off 50 MB tus chunks on slow uplinks and
    # multi-GB kiosk downloads. HTTP_READ_TIMEOUT is how long the client may
    # take to send headers and body. HTTP_WRITE_TIMEOUT is how long the client
    # has to read the response, which is what covers a stalled download.
    # HTTP_IDLE_TIMEOUT is the keepalive gap between requests on an open
    # connection, not a pause in the middle of a response body.
    HTTP_READ_TIMEOUT: 900
    HTTP_WRITE_TIMEOUT: 86400
    HTTP_IDLE_TIMEOUT: 900

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # Match this to any external database server to configure Active Record correctly
    # Use server-db for a db accessory server on same machine via local kamal docker network.
    # DB_HOST: 192.168.0.2

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Use a persistent storage volume for sqlite database files and local Active Storage files.
# Recommended to change this to a mounted volume path that is backed up off server.
volumes:
  - "server_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: ruby-3.4.7
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# Use a different ssh user than root
# ssh:
#   user: app

# Use accessory services (secrets come from .kamal/secrets).
# accessories:
#   db:
#     image: mysql:8.0
#     host: 192.168.0.2
#     # Change to 3306 to expose port to the world instead of just local network.
#     port: "127.0.0.1:3306:3306"
#     env:
#       clear:
#         MYSQL_ROOT_HOST: '%'
#       secret:
#         - MYSQL_ROOT_PASSWORD
#     files:
#       - config/mysql/production.cnf:/etc/mysql/my.cnf
#       - db/production.sql:/docker-entrypoint-initdb.d/setup.sql
#     directories:
#       - data:/var/lib/mysql
#   redis:
#     image: valkey/valkey:8
#     host: 192.168.0.2
#     port: 6379
#     directories:
#       - data:/data
