<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <title>Yui Kiosk — Browser Demo</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body {
        overflow: hidden;
        color: #f8fafc;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 72% 26%, rgba(66, 153, 225, .28), transparent 30%),
          linear-gradient(135deg, #111827 0%, #18263c 55%, #0f172a 100%);
      }
      .demo-page { position: fixed; inset: 0; display: grid; place-items: center; padding: 3rem; }
      .demo-page__content { max-width: 620px; text-align: center; opacity: .92; }
      .demo-page__eyebrow { margin: 0 0 .8rem; color: #93c5fd; font-size: .78rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      .demo-page h1 { margin: 0; font-size: clamp(2.4rem, 7vw, 5.8rem); letter-spacing: -.055em; }
      .demo-page p { margin: 1rem auto 0; max-width: 480px; color: #cbd5e1; font-size: 1.05rem; line-height: 1.65; }
      .demo-badge { position: fixed; right: 18px; bottom: 18px; z-index: 2147483646; padding: 8px 12px; border: 1px solid rgba(255,255,255,.18); border-radius: 999px; color: #dbeafe; background: rgba(15,23,42,.7); backdrop-filter: blur(12px); font-size: 12px; }
    </style>
  </head>
  <body>
    <main class="demo-page" aria-hidden="true">
      <div class="demo-page__content">
        <p class="demo-page__eyebrow">Interactive kiosk preview</p>
        <h1>Welcome to Yui</h1>
        <p>Explore the same app shell, controls, apps, and settings used on a Yui-powered kiosk.</p>
      </div>
    </main>
    <div class="demo-badge">Browser demo · simulated device</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
